<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lịch Dạy</title>
<meta name="theme-color" content="#f3f1fb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lịch Dạy">
<style>
:root{--bg:#f3f1fb;--ink:#17161f;--ink3:#9592a6;--brand:#6C63FF;--card:rgba(255,255,255,.62);--brd:rgba(255,255,255,.75)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0c16;--ink:#f3f2f8;--ink3:#6f6c84;--card:rgba(30,29,44,.6);--brd:rgba(255,255,255,.09)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:20px}
body::before{content:'';position:fixed;inset:-10%;z-index:-1;background:radial-gradient(55% 45% at 0% 0%,#e6dcff 0%,transparent 70%),radial-gradient(45% 40% at 100% 0%,#ffdce9 0%,transparent 70%),radial-gradient(55% 50% at 100% 100%,#d6f0ff 0%,transparent 70%),var(--bg)}
@media (prefers-color-scheme:dark){body::before{background:radial-gradient(55% 45% at 0% 0%,rgba(110,80,220,.35) 0%,transparent 70%),radial-gradient(55% 50% at 100% 100%,rgba(50,130,220,.25) 0%,transparent 70%),var(--bg)}}
.gate{width:min(360px,100%);background:var(--card);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--brd);border-radius:26px;padding:30px 24px 24px;text-align:center;box-shadow:0 20px 60px rgba(70,60,130,.15);display:none}
.gate.on{display:block}
.logo{width:60px;height:60px;border-radius:19px;margin:0 auto 14px;background:url(icons/icon-192.png) center/cover}
h1{font-size:21px;font-weight:800;margin-bottom:18px}
input[type=password]{width:100%;height:46px;border-radius:14px;border:1px solid rgba(60,50,110,.14);background:rgba(255,255,255,.7);padding:0 14px;font-size:16px;outline:none;color:#17161f}
input[type=password]:focus{box-shadow:0 0 0 3px rgba(60,50,110,.08)}
label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--ink3);margin:12px 0 16px;cursor:pointer}
button{width:100%;height:46px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(108,99,255,.3)}
button:disabled{opacity:.6}
.err{color:#ef4444;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<form class="gate" id="gate" autocomplete="on">
  <div class="logo"></div>
  <h1>Lịch Dạy</h1>
  <input type="text" name="username" value="lich-day" autocomplete="username" hidden>
  <input type="password" id="pw" placeholder="Mật khẩu" autocomplete="current-password" required>
  <label><input type="checkbox" id="rem" checked>Nhớ trên thiết bị này</label>
  <button id="go">Mở</button>
  <div class="err" id="err"></div>
</form>

  const K = 'lichday_gate_' + P.salt.slice(0, 8);
  const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  const gate = document.getElementById('gate'), err = document.getElementById('err'), go = document.getElementById('go');
  async function run(key) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(P.iv) }, key, un(P.ct));
    const html = new TextDecoder().decode(pt);
    if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
    setTimeout(() => { document.open(); document.write(html); document.close(); }, 0);
  }
  async function fromPassword(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: un(P.salt), iterations: P.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function auto() {
    try {
      const raw = localStorage.getItem(K);
      if (raw) { const key = await crypto.subtle.importKey('raw', un(raw), 'AES-GCM', false, ['decrypt']); await run(key); return; }
    } catch (e) { try { localStorage.removeItem(K); } catch (_) {} }
    gate.classList.add('on'); document.getElementById('pw').focus();
  }
  gate.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Đang mở…';
    try {
      const key = await fromPassword(document.getElementById('pw').value);
      if (document.getElementById('rem').checked) { try { localStorage.setItem(K, toB64(await crypto.subtle.exportKey('raw', key))); } catch (_) {} }
      await run(key);
    } catch (e2) { err.textContent = 'Sai mật khẩu'; go.disabled = false; go.textContent = 'Mở'; }

  if (!window.crypto || !crypto.subtle) { gate.classList.add('on'); err.textContent = 'Trình duyệt không hỗ trợ, hãy mở bằng link https'; return; }
  auto();
